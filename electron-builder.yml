appId: com.transcriba.app
productName: Transcriba
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # ffprobe-static trae binarios de todas las plataformas; solo se empaqueta el de Windows x64.
  - '!node_modules/ffprobe-static/bin/{darwin,linux}/**'
  - '!node_modules/ffprobe-static/bin/win32/ia32/**'
asarUnpack:
  - resources/**
  # Los exe de ffmpeg/ffprobe no se pueden ejecutar desde dentro del asar.
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/bin/**
win:
  executableName: transcriba
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# "Abrir con" de Windows (spec §6). Las extensiones principales de `src/shared/formats.ts`;
# el instalador NSIS las registra y la tarea 22 lo valida.
fileAssociations:
  - ext: [mp4, mkv, avi, mov, webm, m4v, wmv, flv, mpg, mpeg, ts, m2ts, 3gp, ogv]
    name: Video
    description: Video
    role: Viewer
  - ext: [mp3, wav, m4a, aac, flac, ogg, opus, wma, aiff, amr, mka]
    name: Audio
    description: Audio
    role: Viewer
