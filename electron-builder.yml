appId: com.rebeccawrites.app
productName: RebeccaWrites
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Solo desarrollo: plan, tests, scripts y configuración de agentes no van en el paquete.
  - '!{plans,tests,scripts,.claude}/**'
  - '!{CLAUDE.md,vitest.config.ts}'
  # ffprobe-static trae binarios de todas las plataformas; solo se empaqueta el de Windows x64.
  - '!node_modules/ffprobe-static/bin/{darwin,linux}/**'
  - '!node_modules/ffprobe-static/bin/win32/ia32/**'
  # D2: CUDA (~1,1 GB) no va en el instalador; se descarga desde la app.
  - '!resources/bin/cuda/**'
  - '!resources/bin/.tmp/**'
asarUnpack:
  - resources/**
  # Los exe de ffmpeg/ffprobe no se pueden ejecutar desde dentro del asar.
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/bin/**
win:
  executableName: rebeccawrites
  target:
    - target: nsis
      arch: x64
nsis:
  # Instalador asistido: permite elegir carpeta; accesos directos en escritorio y menú Inicio.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  # userData (historial, modelos) se conserva al desinstalar.
  deleteAppDataOnUninstall: false
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# "Abrir con" de Windows (spec §6). Las extensiones principales de `src/shared/formats.ts`;
# el instalador NSIS las registra y la tarea 22 lo valida.
fileAssociations:
  - ext: [mp4, mkv, avi, mov, webm, m4v, wmv, flv, mpg, mpeg, ts, m2ts, 3gp, ogv]
    name: Video
    description: Video
    role: Viewer
  - ext: [mp3, wav, m4a, aac, flac, ogg, opus, wma, aiff, amr, mka]
    name: Audio
    description: Audio
    role: Viewer
